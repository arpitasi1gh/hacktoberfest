<div class="suggestion-progress">
    <div class="suggestion-progress-heading">
        <label>Task progress</label>
        <output id="progress-out-{{ task_id }}">{{ task_progress }}%</output>
    </div>
    <form hx-post="/tasks/{{ task_id }}/progress" hx-trigger="change" hx-swap="none" style="margin: 0.85rem 0 0.2rem;">
        <input type="range" name="progress" min="0" max="100" value="{{ task_progress }}" 
               style="--progress: {{ task_progress }}%;"
               oninput="this.style.setProperty('--progress', this.value + '%'); document.getElementById('progress-out-{{ task_id }}').textContent = this.value + '%';">
    </form>
    <span class="field-hint">Move progress forward to mark this session done. The task is complete at 100%.</span>
</div>
