<li id="task-{{ task.id }}" class="task-item" style="flex-wrap: wrap; padding-bottom: 1rem;">
    <form hx-post="/tasks/{{ task.id }}/update" hx-target="#task-list-container" hx-swap="innerHTML" class="task-edit-form" style="margin-bottom: 1rem;">
        
        <div class="field">
            <label>Title</label>
            <input type="text" name="title" value="{{ task.title }}" required>
        </div>
        
        <div class="field">
            <label>Notes</label>
            <textarea name="notes" rows="3">{{ task.notes or '' }}</textarea>
        </div>
        
        <div class="task-edit-deadline-grid">
            <div class="field">
                <label>Deadline</label>
                <input type="datetime-local" name="deadline" value="{{ task.deadline or '' }}">
            </div>
            <div class="field">
                <label>Daily time commitment <span style="color: var(--text-faint); font-weight: 400; font-size: 0.85em;">(min/day)</span></label>
                <input type="number" name="estimated_minutes" value="{{ task.estimated_minutes or 45 }}" required>
            </div>
        </div>

        <div class="task-edit-priority-grid">
            <div class="field">
                <label>Energy cost</label>
                <select name="energy_cost">
                    <option value="low" {% if task.energy_cost=='low' %}selected{% endif %}>Low</option>
                    <option value="medium" {% if task.energy_cost=='medium' %}selected{% endif %}>Medium</option>
                    <option value="high" {% if task.energy_cost=='high' %}selected{% endif %}>High</option>
                </select>
            </div>
            <div class="field">
                <label>Importance</label>
                <select name="importance">
                    <option value="1" {% if task.importance == 1 %}selected{% endif %}>1</option>
                    <option value="2" {% if task.importance == 2 %}selected{% endif %}>2</option>
                    <option value="3" {% if task.importance == 3 %}selected{% endif %}>3</option>
                    <option value="4" {% if task.importance == 4 %}selected{% endif %}>4</option>
                    <option value="5" {% if task.importance == 5 %}selected{% endif %}>5</option>
                </select>
            </div>
        </div>

        <div class="task-progress-edit-field">
            <label>Progress <output id="progress-out-{{ task.id }}">{{ task.progress or 0 }}%</output></label>
            <div class="task-progress-edit">
                <input type="range" name="progress" min="0" max="100" value="{{ task.progress or 0 }}" 
                       style="--progress: {{ task.progress or 0 }}%;"
                       oninput="this.style.setProperty('--progress', this.value + '%'); document.getElementById('progress-out-{{ task.id }}').textContent = this.value + '%';">
            </div>
            <span class="field-hint">The task is marked complete at 100%.</span>
        </div>

        <div class="task-edit-actions">
            <button type="submit" class="button button-save-task">Save changes</button>
            <button hx-post="/tasks/{{ task.id }}/edit" hx-target="#task-list-container" hx-swap="innerHTML" type="button" class="button button-quiet">Cancel</button>
        </div>
    </form>
</li>
