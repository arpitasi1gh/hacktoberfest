<div class="action-card">
    <div class="action-kicker"><span class="sparkle">✦</span> YOUR NEXT STEP</div>
    
    <div class="action-main">
        <span class="action-label">FOCUS ON THIS</span>
        <h2>{{ action.action }}</h2>
    </div>
    
    <p class="action-why">{{ action.why }}</p>
    
    <div class="action-detail">
        <span class="detail-label">START HERE</span>
        <p>{{ action.first_step }}</p>
    </div>

    <div class="action-support">
        <div class="timebox">
            <span class="timebox-label">AVAILABLE TIME</span>
            <span class="timebox-value">⏱ {{ action.timebox_minutes }} min</span>
        </div>
        <div class="fallback">
            <span class="fallback-label">IF YOU NEED A SMALLER STEP</span>
            <span class="fallback-text">{{ action.fallback }}</span>
        </div>
    </div>

    {% include "_task_progress.html" %}

    <div class="feedback-actions">
        <form hx-post="/feedback/{{ action_id }}">
            <input type="hidden" name="outcome" value="done">
            <button type="submit" class="button button-primary">Done</button>
        </form>
        <form hx-post="/feedback/{{ action_id }}">
            <input type="hidden" name="outcome" value="skip">
            <button type="submit" class="button button-secondary">Skip</button>
        </form>
        <form hx-post="/feedback/{{ action_id }}">
            <input type="hidden" name="outcome" value="blocked">
            <button type="submit" class="button button-secondary">Blocked</button>
        </form>
    </div>
</div>
