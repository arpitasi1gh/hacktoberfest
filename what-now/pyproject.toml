[project]
name = "what-now"
version = "0.1.0"
description = "A local-first AI next-action coach for college students"
readme = "README.md"
authors = [
    { name = "arpitasi1gh", email = "arpitasi1gh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
what-now = "what_now:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "what_now"
module-root = "src"
