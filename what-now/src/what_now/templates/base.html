<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fff9f7">
  <title>{% block title %}What Now?{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="topbar" aria-label="Main navigation">
    <a class="brand" href="/" aria-label="What Now? home">
      <span class="brand-mark" aria-hidden="true">✿</span>
      <span>What Now?</span>
    </a>
    <div class="nav-actions">
      {% if user %}
      <details class="profile-menu">
        <summary class="profile-trigger" aria-label="Account menu for {{ user.full_name }}">
          <span class="profile-name">{{ user.full_name }}</span>
          <span class="profile-avatar" aria-hidden="true">{{ user.full_name[:1] | upper }}</span>
        </summary>
        <div class="profile-dropdown">
          <span class="profile-email" title="{{ user.email }}">{{ user.email or "Account" }}</span>
          <form action="/logout" method="post" data-confirm="Log out of your account?">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button class="profile-logout" type="submit">
              <span>Log out</span>
              <span aria-hidden="true">↗</span>
            </button>
          </form>
        </div>
      </details>
      {% else %}
      <a class="nav-button" href="/login">Log in</a>
      <a class="nav-button nav-button-accent" href="/signup">Sign up</a>
      {% endif %}
      <form action="/theme" method="post" data-async-form>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="theme-toggle" type="submit" aria-label="Switch to {{ 'light' if theme == 'dark' else 'dark' }} mode">
          <span aria-hidden="true">{{ "☀" if theme == "dark" else "☾" }}</span>
          <span class="theme-toggle-label">{{ "Light" if theme == "dark" else "Dark" }} mode</span>
        </button>
      </form>
    </div>
  </nav>

  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener("submit", (event) => {
      const form = event.target.closest("[data-confirm]");
      if (form && !window.confirm(form.dataset.confirm)) event.preventDefault();
    });

    document.addEventListener("submit", async (event) => {
      const form = event.target.closest("[data-async-form]");
      if (!form || event.defaultPrevented) return;
      event.preventDefault();

      const submitButton = event.submitter || form.querySelector('[type="submit"]');
      const loadingLabel = submitButton?.querySelector(".checkin-submit-label");
      const originalLabel = loadingLabel?.textContent;
      if (submitButton) {
        submitButton.disabled = true;
        submitButton.setAttribute("aria-busy", "true");
      }
      const loadingIcon = submitButton?.querySelector(".checkin-submit-icon");
      const spinner = submitButton?.querySelector(".checkin-spinner");
      if (loadingLabel) loadingLabel.textContent = "Finding your next step…";
      if (loadingIcon) loadingIcon.hidden = true;
      if (spinner) spinner.hidden = false;

      try {
        const response = await fetch(form.action, {
          method: form.method || "POST",
          body: new FormData(form),
          headers: { "X-Requested-With": "fetch" },
        });
        const html = await response.text();
        const updatedPage = new DOMParser().parseFromString(html, "text/html");
        const updatedMain = updatedPage.querySelector(".page-shell");
        const currentMain = document.querySelector(".page-shell");

        if (response.redirected && updatedMain) {
          window.location.assign(response.url);
          return;
        }
        if (updatedMain && currentMain && response.headers.get("content-type")?.includes("text/html")) {
          currentMain.innerHTML = updatedMain.innerHTML;
          document.documentElement.dataset.theme =
            updatedPage.documentElement.dataset.theme || document.documentElement.dataset.theme;
          if (form.action.endsWith("/theme")) {
            const updatedTopbar = updatedPage.querySelector(".topbar");
            const currentTopbar = document.querySelector(".topbar");
            if (updatedTopbar && currentTopbar) {
              currentTopbar.innerHTML = updatedTopbar.innerHTML;
            }
          }
          if (!response.ok) {
            const error = currentMain.querySelector('[role="alert"]');
            if (error) error.focus();
          }
          return;
        }
        if (!response.ok) {
          const detail = JSON.parse(html).detail;
          throw new Error(detail || `The request failed (${response.status}).`);
        }
        throw new Error("The page could not be updated. Reload and try again.");
      } catch (error) {
        if (submitButton) {
          submitButton.disabled = false;
          submitButton.removeAttribute("aria-busy");
          if (loadingLabel && originalLabel !== null) {
            loadingLabel.textContent = originalLabel;
          }
        }
        if (loadingIcon) loadingIcon.hidden = false;
        if (spinner) spinner.hidden = true;
        window.alert(error instanceof Error ? error.message : "The request failed.");
      }
    });
  </script>
</body>
</html>
