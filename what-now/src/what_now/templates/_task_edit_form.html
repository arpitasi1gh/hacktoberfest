<form action="/tasks/{{ task.id }}/edit" method="post" class="form-stack task-form task-edit-form" data-async-form hidden>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="field">
    <label for="title-{{ task.id }}">Title</label>
    <input type="text" id="title-{{ task.id }}" name="title" maxlength="200" value="{{ task.title }}" required>
  </div>
  <div class="field">
    <label for="notes-{{ task.id }}">Notes</label>
    <textarea id="notes-{{ task.id }}" name="notes" rows="3" maxlength="2000" required>{{ task.notes or '' }}</textarea>
  </div>
  <div class="task-edit-deadline-grid">
    <div class="field">
      <label for="deadline-{{ task.id }}">Deadline</label>
      <input type="datetime-local" id="deadline-{{ task.id }}" name="deadline" value="{{ task.deadline or '' }}" required>
    </div>
    <div class="field">
      <label for="daily-minutes-{{ task.id }}">Daily time commitment</label>
      <div class="input-suffix">
        <input type="number" id="daily-minutes-{{ task.id }}" name="daily_minutes" min="5" max="600"
               value="{{ task.estimated_minutes }}" required>
        <span>min/day</span>
      </div>
    </div>
  </div>
  <div class="task-edit-priority-grid">
    <div class="field">
      <label for="energy-cost-{{ task.id }}">Energy cost</label>
      <select id="energy-cost-{{ task.id }}" name="energy_cost">
        <option value="low" {{ "selected" if task.energy_cost == "low" else "" }}>Low</option>
        <option value="medium" {{ "selected" if task.energy_cost == "medium" else "" }}>Medium</option>
        <option value="high" {{ "selected" if task.energy_cost == "high" else "" }}>High</option>
      </select>
    </div>
    <div class="field">
      <label for="importance-{{ task.id }}">Importance</label>
      <select id="importance-{{ task.id }}" name="importance">
        {% for level in range(1, 6) %}
        <option value="{{ level }}" {{ "selected" if task.importance == level else "" }}>
          {{ level }}{{ " · highest" if level == 5 else " · important" if level == 3 else "" }}
        </option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="field task-progress-edit-field">
    <label for="progress-{{ task.id }}">Progress <output for="progress-{{ task.id }}">{{ task.progress }}%</output></label>
    <div class="task-progress-edit">
      <input type="range" id="progress-{{ task.id }}" name="progress" min="0" max="100"
             value="{{ task.progress }}" data-task-progress-slider required>
    </div>
    <span class="field-hint">The task is marked complete at 100%.</span>
  </div>
  <div class="task-edit-actions">
    <button class="button button-save-task" type="submit">Save changes</button>
    <button class="button button-quiet" type="button" data-task-edit-cancel>Cancel</button>
  </div>
</form>
