[project]
name = "greenstep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arpitasi1gh", email = "arpitasi1gh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "serpapi>=1.1.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
greenstep = "greenstep:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
