{# Expects: action (str), place (dict) #}
<section class="card card--accent">
  <div class="action-head">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
      <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    <span>{{ place.title }}</span>
    <span class="action-head__sep">&middot;</span>
    <span>{{ place.type }}</span>

    {% if place.rating and place.rating != "N/A" %}
    <span class="action-head__rating">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.9 6.9L22 9.8l-5.4 4.9 1.6 7.3L12 18.3 5.8 22l1.6-7.3L2 9.8l7.1-.9L12 2z" />
      </svg>
      {{ place.rating }}
    </span>
    {% endif %}
  </div>

  <p class="action-text">{{ action }}</p>
</section>
